<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>QUOS Bots / Status</title><style>body{margin:0;background:#f8f8f6;color:#111;font:15px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:35px}.bar{display:flex;align-items:center;gap:11px;border-bottom:1px solid #111;padding-bottom:19px}.square{width:22px;height:22px;background:#e32119}.brand{font-weight:800;letter-spacing:-.06em}.eyebrow{font:11px monospace;letter-spacing:.12em;color:#666;margin-top:52px}.hero{font-size:clamp(45px,8vw,100px);line-height:.84;letter-spacing:-.09em;margin:14px 0 45px}.red{color:#e32119}.grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #111}.cell{padding:20px;border-right:1px solid #111}.cell:last-child{border:0}.n{font-size:42px;font-weight:800;letter-spacing:-.08em}.label{font:11px monospace;text-transform:uppercase;letter-spacing:.08em}.report{border-top:1px solid #111;padding:14px 0}.report b{font:12px monospace}.note{margin-top:35px;color:#555}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.cell:nth-child(2){border-right:0}.cell:nth-child(-n+2){border-bottom:1px solid #111}}</style></head><body><main class="wrap"><header class="bar"><span class="square"></span><span class="brand">QUOS<br/>BOTS</span><span style="margin-left:auto;font:11px monospace">QB-000 / OPERATIONS</span></header><p class="eyebrow">ONE APPLICATION / 101 INTERNAL PERSONAS</p><h1 class="hero">System<br/><span class="red">status.</span></h1><section class="grid" id="stats"></section><p class="eyebrow">RECENT REPORTS TO QB-000</p><section id="reports"></section><p class="note" id="notice"></p></main><script>fetch('/api/status').then(r=>r.json()).then(s=>{document.querySelector('#stats').innerHTML=[['gateway',s.gateway],['personas',s.personas],['channels',s.channels],['published knowledge',s.publishedKnowledge]].map(([k,v])=>`<div class="cell"><div class="n">${v}</div><div class="label">${k}</div></div>`).join('');document.querySelector('#reports').innerHTML=s.reports.map(r=>`<article class="report"><b>${r.kind.toUpperCase()} / ${r.personaId}</b><p>${r.summary}</p></article>`).join('')||'<p>No reports recorded yet.</p>';document.querySelector('#notice').textContent=s.freeTierNotice;}).catch(()=>document.querySelector('#notice').textContent='Status data is unavailable.');</script></body></html>
