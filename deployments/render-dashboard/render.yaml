services:
  - type: web
    name: quos-bots-dashboard
    runtime: node
    plan: free
    rootDir: deployments/render-dashboard
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
