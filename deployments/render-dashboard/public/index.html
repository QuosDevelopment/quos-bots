<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QUOS / Operations</title>
    <style>
      :root{--paper:#f7f6f1;--ink:#111;--red:#e61e25;--line:#161616}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{max-width:1500px;margin:0 auto;padding:28px 32px 64px}.top{display:grid;grid-template-columns:88px 1fr auto;gap:18px;align-items:start;border-bottom:2px solid var(--line);padding-bottom:20px}.mark{width:68px;height:68px;background:var(--red)}h1{font-size:clamp(2.2rem,5vw,5.3rem);letter-spacing:-.075em;line-height:.78;margin:4px 0 16px;text-transform:uppercase}.eyebrow,.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.live{border-left:1px solid var(--line);padding-left:18px;min-width:190px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:26px}.panel{border-top:2px solid var(--line);padding-top:10px}.metric{grid-column:span 3}.metric strong{display:block;font-size:clamp(2.5rem,5vw,4.8rem);letter-spacing:-.08em;margin-top:12px}.wide{grid-column:span 12}.half{grid-column:span 6}.bot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}.bot{min-height:128px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px}.bot b{display:block;font-size:18px}.bot small{display:block;margin-top:7px;line-height:1.35}.status{display:inline-block;margin-top:11px;padding:4px 6px;background:var(--ink);color:var(--paper);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.attention{background:var(--red)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);text-align:left;padding:10px 6px;vertical-align:top}th{font-size:10px;letter-spacing:.1em;text-transform:uppercase}.notice{border:1px solid var(--line);padding:12px;font-size:12px;line-height:1.45}#error{color:var(--red);font-weight:700}@media(max-width:760px){.shell{padding:20px}.top{grid-template-columns:50px 1fr}.mark{width:42px;height:42px}.live{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:10px 0 0}.metric,.half{grid-column:span 12}}
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top"><div class="mark"></div><div><div class="eyebrow">QUOS Bots / private operations console</div><h1>System<br>index</h1></div><div class="live"><div class="label">Gateway</div><strong id="gateway">Loading</strong><div class="label" id="updated">Checking Firebase</div></div></header>
      <section class="grid"><article class="panel metric"><div class="label">Personas</div><strong id="botCount">—</strong></article><article class="panel metric"><div class="label">Active / attention</div><strong id="healthCount">—</strong></article><article class="panel metric"><div class="label">Verified ledger</div><strong id="earningsTotal">—</strong></article><article class="panel metric"><div class="label">Task records</div><strong id="taskCount">—</strong></article><article class="wide"><div class="label">101 persona index</div><div id="bots" class="bot-grid"></div></article><article class="panel half"><div class="label">Task history</div><table><thead><tr><th>Time</th><th>Bot</th><th>Type</th><th>Outcome</th></tr></thead><tbody id="tasks"></tbody></table></article><article class="panel half"><div class="label">Earnings ledger</div><table><thead><tr><th>Time</th><th>Bot</th><th>Amount</th><th>Note</th></tr></thead><tbody id="earnings"></tbody></table></article><article class="wide"><div id="notice" class="notice">Loading operational note…</div><div id="error"></div></article></section>
    </main>
    <script>
      const money=value=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(value||0);const date=value=>value?new Date(value).toLocaleString():'—';const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      async function load(){try{const response=await fetch('/api/overview');if(!response.ok)throw new Error(await response.text());const data=await response.json();document.querySelector('#gateway').textContent=data.gateway;document.querySelector('#updated').textContent=data.updatedAt?`Updated ${date(data.updatedAt)}`:'No runtime signal';document.querySelector('#botCount').textContent=data.bots.length;const attention=data.bots.filter(bot=>bot.operationalStatus==='attention').length;const active=data.bots.filter(bot=>bot.operationalStatus==='active').length;document.querySelector('#healthCount').textContent=`${active}/${attention}`;document.querySelector('#earningsTotal').textContent=money(data.earnings.total);document.querySelector('#taskCount').textContent=data.tasks.length;document.querySelector('#notice').textContent=data.quotaNotice;document.querySelector('#bots').innerHTML=data.bots.map(bot=>`<article class="bot"><b>${escape(bot.id)}</b><small>${escape(bot.role)}</small><span class="status ${bot.operationalStatus==='attention'?'attention':''}">${escape(bot.operationalStatus)}</span></article>`).join('');document.querySelector('#tasks').innerHTML=data.tasks.map(task=>`<tr><td>${date(task.createdAt)}</td><td>${escape(task.personaId)}</td><td>${escape(task.type)}</td><td>${escape(task.outcome)}</td></tr>`).join('')||'<tr><td colspan="4">No persisted task history yet.</td></tr>';document.querySelector('#earnings').innerHTML=data.earnings.entries.map(entry=>`<tr><td>${date(entry.createdAt)}</td><td>${escape(entry.personaId)}</td><td>${money(entry.amount)}</td><td>${escape(entry.note)}</td></tr>`).join('')||'<tr><td colspan="4">No verified ledger entries yet.</td></tr>';}catch(error){document.querySelector('#error').textContent=`Dashboard data unavailable: ${error.message}`}}load();setInterval(load,30000);
    </script>
  </body>
</html>
