name: Deploy QUOS dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "github-pages-dashboard/**"
      - "scripts/export-github-pages-roster.mjs"
      - "standalone/personas.mjs"
      - ".github/workflows/deploy-quos-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the canonical 101-persona directory
        run: node scripts/export-github-pages-roster.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-dashboard

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
